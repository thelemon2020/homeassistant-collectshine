name: Validate

on:
  push:
  pull_request:
  # Both validators track upstream releases rather than this repository, so being able to re-run
  # them without an empty commit is worth the two lines.
  workflow_dispatch:
  schedule:
    # Both validators track Home Assistant releases, so a component that passed last month can
    # fail today without anything here changing. Weekly is early enough to hear about it.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Blocking. Every check passes, including brands — satisfied by the assets inside the
    # integration, which HACS looks for before falling back to the home-assistant/brands
    # repository. Submitting to that repository is still worth doing for the default store, but
    # it is no longer what stands between this and a green run.
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
