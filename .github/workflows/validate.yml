name: Validate

on:
  push:
  pull_request:
  # Both validators track upstream releases rather than this repository, so being able to re-run
  # them without an empty commit is worth the two lines.
  workflow_dispatch:
  schedule:
    # Both validators track Home Assistant releases, so a component that passed last month can
    # fail today without anything here changing. Weekly is early enough to hear about it.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Advisory while this repository is private, and deliberately so rather than deleted.
    #
    # Several HACS checks — hacsjson, integration_manifest, brands — read the repository back
    # through the GitHub API rather than from the checkout, and those calls return nothing for a
    # private repository however the workflow token is passed. The action reports the empty
    # response as a malformed file, which is a misleading way to say 404, so a red X here says
    # nothing about whether the files are actually correct.
    #
    # hassfest is the job that genuinely validates this integration, and it blocks.
    #
    # Make this blocking again when the repository goes public. At that point `license` and
    # `brands` become real work: HACS requires a licence, and the integration must be added to
    # the home-assistant/brands repository for an icon.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
