name: Validate

on:
  push:
  pull_request:
  # Both validators track upstream releases rather than this repository, so being able to re-run
  # them without an empty commit is worth the two lines.
  workflow_dispatch:
  schedule:
    # Both validators track Home Assistant releases, so a component that passed last month can
    # fail today without anything here changing. Weekly is early enough to hear about it.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Advisory, for one remaining reason: the `brands` check requires this integration to be
    # listed in the home-assistant/brands repository, which is a separate upstream pull request
    # carrying icon and logo assets. Everything else here passes.
    #
    # Make this blocking once that PR lands — at which point a red X means something again.
    #
    # hassfest is the check that actually validates the integration, and it blocks today.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
