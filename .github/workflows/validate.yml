name: Validate

on:
  push:
  pull_request:
  schedule:
    # Both validators track Home Assistant releases, so a component that passed last month can
    # fail today without anything here changing. Weekly is early enough to hear about it.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
        env:
          # The manifest check reads the file back through the GitHub API. On a private
          # repository that call is unauthenticated without this and returns nothing, which the
          # action reports as a malformed manifest rather than as a permissions problem.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
